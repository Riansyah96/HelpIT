services:
  app:
    image: your-dockerhub-username/laravel-app:latest   # ganti dengan username Anda
    container_name: app
    restart: unless-stopped
    # Volume mount untuk kode TIDAK ADA di sini
    depends_on:
      - db
    networks:
      - techease_network

  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: techease_db
      MYSQL_USER: techease_user
      MYSQL_PASSWORD: password123
      MYSQL_ROOT_PASSWORD: admin123
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - techease_network

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      # Mount storage dan cache agar persist (opsional)
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    depends_on:
      - app
    networks:
      - techease_network

networks:
  techease_network:
    driver: bridge

volumes:
  db_data:
