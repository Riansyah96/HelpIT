name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted   # atau 'ubuntu-latest' jika pakai runner publik, tapi sesuaikan

    steps:
      # 1. Checkout kode
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cek koneksi internet (diagnostik)
      - name: Check internet connectivity
        run: |
          echo "Testing connection to Docker Hub..."
          curl -v https://registry-1.docker.io/v2/ || echo "Curl failed"
          dig registry-1.docker.io || echo "Dig failed"

      # 3. Login ke Docker Hub dengan retry
      - name: Login to Docker Hub
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i to login to Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            if [ $? -eq 0 ]; then
              echo "Login successful"
              break
            fi
            echo "Login failed, retrying in 10 seconds..."
            sleep 10
          done

      # 4. Build dan push image (dengan retry jika gagal)
      - name: Build and push app image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/laravel-app:latest -t ${{ secrets.DOCKER_USERNAME }}/laravel-app:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/laravel-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/laravel-app:${{ github.sha }}

      # 5. Deploy ke server via SSH
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/techease
            docker compose pull app
            docker compose up -d --force-recreate --remove-orphans app
            sleep 5
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose restart nginx
            docker image prune -af
