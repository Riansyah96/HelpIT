name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i login..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            if [ $? -eq 0 ]; then break; fi
            sleep 10
          done

      - name: Build and push image (with retry)
        run: |
          # Build image
          docker build -t ${{ secrets.DOCKER_USERNAME }}/laravel-app:latest -t ${{ secrets.DOCKER_USERNAME }}/laravel-app:${{ github.sha }} .

          # Push dengan retry
          for tag in latest ${{ github.sha }}; do
            for i in 1 2 3 4 5; do
              echo "Pushing tag $tag, attempt $i..."
              docker push ${{ secrets.DOCKER_USERNAME }}/laravel-app:$tag
              if [ $? -eq 0 ]; then break; fi
              echo "Push failed, retrying in 10 seconds..."
              sleep 10
            done
          done

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/techease
            docker compose pull app
            docker compose up -d --force-recreate --remove-orphans app
            sleep 5
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose restart nginx
            docker image prune -af
