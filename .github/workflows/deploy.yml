name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =============================================
      # DEBUG: Cek Login ke Docker Hub
      # =============================================
      - name: Test Docker Hub login
        run: |
          echo "Mencoba login ke Docker Hub..."
          echo "${{ secrets.DockerHub_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          if [ $? -eq 0 ]; then
            echo "✅ Login berhasil!"
          else
            echo "❌ Login gagal! Periksa DOCKER_USERNAME dan DockerHub_TOKEN."
            exit 1
          fi

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/laravel-app:latest
            ${{ secrets.DOCKER_USERNAME }}/laravel-app:${{ github.sha }}

      - name: Deploy to Server
        run: |
          set -e
          cd /var/www/techease
          docker compose pull app
          docker compose down || true
          docker compose up -d
          docker image prune -f
          echo "✅ Deploy selesai!"
