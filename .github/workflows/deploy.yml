name: Deploy to Production

on:
  # Memungkinkan Anda menjalankan workflow secara manual dari tab Actions
  workflow_dispatch:

  # Otomatis berjalan ketika ada push ke branch main
  push:
    branches:
      - main   # Ganti dengan branch produksi Anda (misal: master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          # Gunakan nama secret yang ADA di repo Anda: DockerHub_TOKEN
          password: ${{ secrets.DockerHub_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/laravel-app:latest
            ${{ secrets.DOCKER_USERNAME }}/laravel-app:${{ github.sha }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Tambahkan timeout lebih panjang (opsional, default 30s)
          timeout: 60s
          script: |
            # Masuk ke direktori project
            cd /var/www/techease

            # Pull image terbaru dari Docker Hub
            docker compose pull app

            # Hentikan container lama
            docker compose down

            # Jalankan container baru
            docker compose up -d

            # Hapus image yang tidak terpakai
            docker image prune -f
