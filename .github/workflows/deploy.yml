name: Deploy to Production

on:
  push:
    branches:
      - main   # atau branch produksi Anda

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/laravel-app:latest
            ${{ secrets.DOCKER_USERNAME }}/laravel-app:${{ github.sha }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/techease
            # Tarik image terbaru
            docker compose pull app
            # Jalankan ulang container
            docker compose down
            docker compose up -d

            # Tunggu beberapa detik agar container siap
            sleep 5

            # Jalankan migrasi (jika ada)
            docker compose exec -T app php artisan migrate --force

            # Bersihkan cache Laravel
            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan cache:clear
            docker compose exec -T app php artisan view:clear
            docker compose exec -T app php artisan route:clear

            # (Opsional) Optimasi untuk produksi
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache

            # Restart app agar benar-benar segar (opsional)
            docker compose restart app

            # Bersihkan image lama (optional)
            docker image prune -f
