name: Deploy to Production

on:
  # Jalankan manual dari tab Actions
  workflow_dispatch:

  # Otomatis saat push ke main
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DockerHub_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/laravel-app:latest
            ${{ secrets.DOCKER_USERNAME }}/laravel-app:${{ github.sha }}

      # === DEBUG: Cek koneksi ke server sebelum deploy ===
      - name: Debug SSH connectivity
        run: |
          echo "Testing SSH connection to ${{ secrets.SSH_HOST }} on port ${{ secrets.SSH_PORT }}"
          timeout 10s nc -zv ${{ secrets.SSH_HOST }} ${{ secrets.SSH_PORT }} || echo "Port ${{ secrets.SSH_PORT }} is NOT reachable. Please check your firewall."

      # === DEPLOY via SSH ===
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s               # time untuk koneksi
          command_timeout: 10m       # time untuk menjalankan script
          # Jika ada masalah dengan cipher, bisa aktifkan opsi di bawah (tapi biasanya tidak perlu)
          # use_insecure_cipher: true
          # cipher: aes256-ctr
          script: |
            set -e  # hentikan jika ada error
            echo "Masuk ke direktori project"
            cd /var/www/techease || { echo "Direktori tidak ditemukan"; exit 1; }

            echo "Pull image terbaru dari Docker Hub"
            docker compose pull app

            echo "Hentikan container lama"
            docker compose down

            echo "Jalankan container baru"
            docker compose up -d

            echo "Hapus image yang tidak terpakai"
            docker image prune -f

            echo "Deploy selesai!"
